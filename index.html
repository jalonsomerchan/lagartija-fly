<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Lagartija Fly, juego móvil de esquivar obstáculos y recoger monedas con controles por swipe." />
    <meta name="theme-color" content="#73d6ff" />
    <title>Lagartija Fly</title>
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="game" class="game-shell" aria-label="Lagartija Fly">
      <canvas id="gameCanvas" aria-label="Zona de juego"></canvas>

      <section class="hud" aria-live="polite">
        <div><span>Puntos</span><strong id="score">0</strong></div>
        <div><span>Monedas</span><strong id="coins">0</strong></div>
        <div><span>Récord</span><strong id="best">0</strong></div>
      </section>

      <section id="panel" class="panel">
        <img src="/src/assets/lagartija.gif" alt="Lagartija voladora" class="hero" />
        <p class="eyebrow">Juego móvil</p>
        <h1>Lagartija Fly</h1>
        <p id="panelText">Vuela entre los peligros, recoge monedas y aguanta todo lo que puedas.</p>
        <button id="playBtn" class="primary">Jugar</button>
        <div id="levels" class="levels" hidden>
          <button data-level="easy">Fácil</button>
          <button data-level="normal">Medio</button>
          <button data-level="hard">Difícil</button>
        </div>
        <p class="help">Swipe arriba para subir · swipe abajo para bajar</p>
      </section>
    </main>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
